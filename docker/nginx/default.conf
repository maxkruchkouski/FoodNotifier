server {
    listen 80;
    server_name localhost;
    index index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # 1. Раздача фронтенда из примонтированной папки
    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }

    # 2. Проксирование всех запросов /api в Laravel бэкенд
    location /api {
        alias /var/www/backend/public;
        try_files $uri $uri/ /api/index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass backend:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            # Явно указываем путь к public папке Laravel для корректной работы скриптов
            fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }
}
