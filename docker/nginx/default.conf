server {
    listen 80;
    server_name localhost;

    # 1. ОБРАБОТКА СТАТИКИ ФРОНТЕНДА
    location / {
        root /var/www/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. МАРШРУТИЗАЦИЯ LARAVEL API
    location /api {
        root /var/www/backend/public;

        # Если это не физический файл статики бэкенда,
        # принудительно отправляем управление на выделенный PHP-блок
        try_files $uri $uri/ @laravel;
    }

    # Изолированный блок обработки PHP-FPM для Laravel
    location @laravel {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;

        # Жестко указываем путь к index.php Laravel
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;

        # Передаем оригинальный URI, чтобы Laravel-роутер понял запрос /api/test
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
    }
}