server {
    listen 80;
    server_name localhost;

    # Корень по умолчанию для статики фронтенда
    root /var/www/frontend;
    index index.html;

    # 1. Красивые URL для фронтенда
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # 2. Обработка всех API запросов напрямую через PHP-FPM без промежуточных редиректов
    location /api {
        root /var/www/backend/public;

        # Пересылаем запрос в PHP-FPM, явно указывая на index.php бэкенда
        fastcgi_pass backend:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        # Важнейшие параметры: передаем физический путь к index.php Laravel
        # и сохраняем исходный URI (?query_string)
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
    }

    # Изолируем обработку любых других .php файлов (если они вдруг понадобятся)
    location ~ \.php$ {
        root /var/www/backend/public;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public$fastcgi_script_name;
    }
}
