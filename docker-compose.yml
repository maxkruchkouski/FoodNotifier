version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: foodnotifier-nginx
    ports:
      - "8000:80"
    volumes:
      - ./frontend:/var/www/frontend
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: foodnotifier-backend
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - postgres

  frontend:
    image: node:20-alpine
    container_name: foodnotifier-frontend
    working_dir: /var/www/frontend
    volumes:
      - ./frontend:/var/www/frontend
      - /var/www/frontend/node_modules
    environment:
      - VITE_API_URL=/api/v1
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"

  postgres:
    image: postgres:15-alpine
    container_name: foodnotifier-postgres
    environment:
      POSTGRES_DB: food_notifire
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my_secret_password
    ports:
      - "5433:5432" # ИСПРАВЛЕНО: наружу отдаем 5433, внутри контейнера стандартный 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
