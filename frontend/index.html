<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodNotifier SaaS</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --accent: #ff9f1c; --text: #fff; --muted: #a0a0a0; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: var(--card); border-radius: 20px; padding: 30px 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; border: 1px solid #2d2d2d; width: 100%; max-width: 360px; }
        .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 100%; padding: 14px; font-size: 22px; font-weight: bold; text-align: center; background: #2a2a2a; border: 2px solid #3d3d3d; border-radius: 12px; color: #fff; box-sizing: border-box; margin-bottom: 20px; }
        input:focus { border-color: var(--accent); outline: none; }
        button, .btn { width: 100%; padding: 14px; font-size: 16px; font-weight: 600; color: #000; background: var(--accent); border: none; border-radius: 12px; cursor: pointer; transition: opacity 0.2s; box-sizing: border-box; }
        button:hover, .btn:hover { opacity: 0.9; }
        .hidden { display: none; }
        .cafe-btn { background: #2a2a2a; color: #fff; border: 1px solid #3d3d3d; text-align: left; margin-bottom: 10px; padding: 14px; border-radius: 12px; width: 100%; cursor: pointer; font-size: 16px; }
        .cafe-btn:hover { border-color: var(--accent); background: #333; }
        .pulse { animation: p 1.8s infinite ease-in-out; color: var(--accent); font-size: 20px; font-weight: 600; }
        @keyframes p { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
</head>
<body>

<div class="card">
    <h1 style="font-size: 26px; margin: 0 0 5px 0;">FoodNotifier</h1>
    <div class="subtitle" id="brand-subtitle">Загрузка...</div>

    <!-- Скрин 1: Выбор ресторана -->
    <div id="select-screen" class="hidden">
        <h3 style="margin-bottom: 15px;">Выберите заведение:</h3>
        <div id="restaurants-list"><div style="color: var(--muted);">Загрузка списка...</div></div>
    </div>

    <!-- Скрин 2: Ввод заказа -->
    <div id="form-screen" class="hidden">
        <h3 style="margin-bottom: 15px;">Введите номер заказа с чека:</h3>
        <input type="number" id="order_number" placeholder="00" min="1" inputmode="numeric">
        <button id="start-btn">Следить за готовностью</button>
    </div>

    <!-- Скрин 3: Статус готовности -->
    <div id="status-screen" class="hidden">
        <div style="background: #2a2a2a; padding: 6px 16px; border-radius: 20px; display: inline-block; margin-bottom: 20px; font-size: 14px; color: var(--muted);">ЗАКАЗ № <span id="display-num" style="color: var(--accent); font-weight: bold;">0</span></div>
        <div style="margin: 30px 0;" id="status-text" class="pulse">⏳ Готовится...</div>
        <button id="reset-btn" style="background:transparent; color:var(--muted); border:1px solid #3d3d3d;">Другой заказ</button>
    </div>
</div>

<script>
    const API = '/api';
    const rId = new URLSearchParams(window.location.search).get('restaurant');
    let currentId = null, interval = null;

    document.addEventListener("DOMContentLoaded", async () => {
        if (!rId) {
            document.getElementById('brand-subtitle').innerText = "Мульти-SaaS платформа";
            document.getElementById('select-screen').classList.remove('hidden');
            return loadCafes();
        }

        document.getElementById('brand-subtitle').innerText = `Заведение: ${rId}`;
        document.getElementById('form-screen').classList.remove('hidden');

        const sId = localStorage.getItem(`id_${rId}`), sNum = localStorage.getItem(`num_${rId}`);
        if (sId && sNum) { currentId = sId; showStatus(sNum); startCheck(); }
    });

    async function loadCafes() {
        const list = document.getElementById('restaurants-list');
        try {
            const res = await (await fetch(`${API}/restaurants/list`)).json();
            list.innerHTML = '';
            if (res.success && res.data.length > 0) {
                res.data.forEach(c => {
                    const b = document.createElement('button');
                    b.className = 'cafe-btn';
                    b.innerText = c.name;
                    b.onclick = () => window.location.search = `?restaurant=${c.slug}`;
                    list.appendChild(b);
                });
            } else { list.innerHTML = 'Нет активных заведений'; }
        } catch { list.innerHTML = 'Ошибка соединения'; }
    }

    function showStatus(num) {
        document.getElementById('form-screen').classList.add('hidden');
        document.getElementById('status-screen').classList.remove('hidden');
        document.getElementById('display-num').innerText = num;
    }

    document.getElementById('start-btn').onclick = async () => {
        const num = document.getElementById('order_number').value;
        if (!num) return alert('Введите номер');
        try {
            const res = await (await fetch(`${API}/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ order_number: num, restaurant_id: rId })
            })).json();
            if (res.success) {
                currentId = res.order_id;
                localStorage.setItem(`id_${rId}`, currentId);
                localStorage.setItem(`num_${rId}`, num);
                showStatus(num);
                startCheck();
            } else { alert(res.message || res.error); }
        } catch { alert('Ошибка сети'); }
    };

    function startCheck() {
        if (interval) clearInterval(interval);
        interval = setInterval(async () => {
            try {
                const res = await (await fetch(`${API}/orders/status?order_id=${currentId}&restaurant_id=${rId}`)).json();
                if (res.status === 'ready') {
                    clearInterval(interval);
                    document.getElementById('status-text').innerHTML = "🎉 Ваш заказ ГОТОВ!";
                    document.getElementById('status-text').className = '';
                }
            } catch (e) { console.error(e); }
        }, 5000);
    }

    document.getElementById('reset-btn').onclick = () => {
        clearInterval(interval);
        localStorage.removeItem(`id_${rId}`);
        localStorage.removeItem(`num_${rId}`);
        document.getElementById('status-screen').classList.add('hidden');
        document.getElementById('form-screen').classList.remove('hidden');
    };
</script>
</body>
</html>
