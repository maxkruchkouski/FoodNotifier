<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статус заказа | FoodNotifier SaaS</title>
    <style>
        :root {
            --bg-color: #121212; --card-bg: #1e1e1e; --accent-color: #ff9f1c; --accent-hover: #e68a15; --text-main: #ffffff; --text-muted: #a0a0a0; --success-color: #2ecc71;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container { width: 100%; max-width: 400px; padding: 24px; box-sizing: border-box; }
        .card { background-color: var(--card-bg); border-radius: 20px; padding: 30px 24px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); text-align: center; border: 1px solid #2d2d2d; }
        .logo { display: flex; justify-content: center; margin-bottom: 15px; }
        h1 { font-size: 26px; margin: 0 0 8px 0; font-weight: 700; }
        .subtitle { color: var(--text-muted); font-size: 14px; margin: 0 0 30px 0; text-transform: uppercase; letter-spacing: 2px; }
        .form-group h3 { font-size: 16px; font-weight: 500; margin-bottom: 15px; color: #e0e0e0; }
        input[type="number"] { width: 100%; padding: 16px; font-size: 24px; font-weight: bold; text-align: center; background-color: #2a2a2a; border: 2px solid #3d3d3d; border-radius: 12px; color: #fff; box-sizing: border-box; transition: border-color 0.3s; margin-bottom: 20px; }
        input[type="number"]:focus { border-color: var(--accent-color); outline: none; }
        button { width: 100%; padding: 16px; font-size: 16px; font-weight: 600; color: #000; background-color: var(--accent-color); border: none; border-radius: 12px; cursor: pointer; transition: background-color 0.2s, transform 0.1s; }
        button:hover { background-color: var(--accent-hover); }
        button:active { transform: scale(0.98); }
        .hidden { display: none; }
        .order-number-display { font-size: 14px; color: var(--text-muted); background: #2a2a2a; padding: 6px 16px; border-radius: 20px; display: inline-block; margin-bottom: 20px; }
        .order-number-display span { color: var(--accent-color); font-weight: bold; }
        .status-box { margin: 40px 0; }
        .loader-text { font-size: 22px; font-weight: 600; color: var(--accent-color); animation: pulse 1.8s infinite ease-in-out; text-align: center; }
        .ready-text { font-size: 24px; font-weight: 700; color: var(--success-color); line-height: 1.4; }
        .reset-btn { background-color: transparent; color: var(--text-muted); border: 1px solid #3d3d3d; margin-top: 20px; font-size: 14px; padding: 10px; width: 100%; border-radius: 12px; cursor: pointer; }
        .reset-btn:hover { background-color: #2a2a2a; color: #fff; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1.02); } 100% { opacity: 0.5; transform: scale(0.98); } }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="logo">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                <path d="M2 19h20v2H2v-2zm10-15a1 1 0 0 1 1 1v1.07A8.001 8.001 0 0 1 20 14H4a8.001 8.001 0 0 1 7-6.93V5a1 1 0 0 1 1-1zm0 4a6 6 0 0 0-6 6h12a6 6 0 0 0-6-6z" fill="#ff9f1c"/>
            </svg>
        </div>
        <h1 id="brand-title">FoodNotifier</h1>
        <div class="subtitle" id="brand-subtitle">Загрузка заведения...</div>

        <!-- ЭКРАН 1: Ввод номера заказа -->
        <div id="form-screen">
            <div class="form-group">
                <h3>Введите номер заказа с чека:</h3>
                <input type="number" id="order_number" placeholder="00" min="1" inputmode="numeric">
            </div>
            <button id="start-btn">Следить за готовностью</button>
        </div>

        <!-- ЭКРАН 2: Ожидание готовности -->
        <div id="status-screen" class="hidden">
            <div class="order-number-display">ЗАКАЗ № <span id="display-num">0</span></div>
            <div class="status-box">
                <div id="status-box-text" class="loader-text">⏳ Готовится...<br><span style="font-size:14px; font-weight:normal; color:var(--text-muted);">Присядьте за столик, мы сообщим!</span></div>
            </div>
            <button id="reset-btn" class="reset-btn hidden">Отслеживать другой заказ</button>
        </div>
    </div>
</div>

<script>
    // Поскольку фронтенд и бэкенд крутятся на одном порту 8000 через Nginx Reverse Proxy,
    // мы можем использовать относительный путь '/api' вместо жесткого указания 'http://localhost:8000/api'
    const API_BASE_URL = 'http://localhost:8000/api';

    const urlParams = new URLSearchParams(window.location.search);
    const restaurantId = urlParams.get('restaurant') || 'default_cafe';

    document.getElementById('brand-subtitle').innerText = `Заведение: ${restaurantId}`;

    let currentOrderId = null;
    let checkInterval = null;

    document.addEventListener("DOMContentLoaded", function() {
        const savedOrderId = localStorage.getItem(`active_order_id_${restaurantId}`);
        const savedOrderNum = localStorage.getItem(`active_order_num_${restaurantId}`);

        if (savedOrderId && savedOrderNum) {
            currentOrderId = savedOrderId;
            showStatusScreen(savedOrderNum);
            startCheckingStatus();
        }
    });

    function showStatusScreen(orderNum) {
        document.getElementById('form-screen').classList.add('hidden');
        document.getElementById('status-screen').classList.remove('hidden');
        document.getElementById('display-num').innerText = orderNum;

        const textBox = document.getElementById('status-box-text');
        textBox.className = 'loader-text';
        textBox.innerHTML = `⏳ Готовится...<br><span style="font-size:14px; font-weight:normal; color:var(--text-muted);">Присядьте за столик, мы сообщим!</span>`;
        document.getElementById('reset-btn').classList.add('hidden');
    }

    document.getElementById('start-btn').addEventListener('click', function() {
        const orderNum = document.getElementById('order_number').value;
        if (!orderNum) {
            alert('Пожалуйста, введите номер заказа');
            return;
        }

        let formData = new FormData();
        formData.append('order_number', orderNum);
        formData.append('restaurant_id', restaurantId);

        fetch(`${API_BASE_URL}/orders`, {
            method: 'POST',
            body: formData
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    currentOrderId = data.order_id;
                    localStorage.setItem(`active_order_id_${restaurantId}`, currentOrderId);
                    localStorage.setItem(`active_order_num_${restaurantId}`, orderNum);

                    showStatusScreen(orderNum);
                    startCheckingStatus();
                } else {
                    alert(data.message || data.error);
                }
            })
            .catch(err => {
                alert('Не удалось связаться с сервером API');
                console.error("Ошибка:", err);
            });
    });

    function startCheckingStatus() {
        if (checkInterval) clearInterval(checkInterval);

        checkInterval = setInterval(() => {
            fetch(`${API_BASE_URL}/orders/status?order_id=${currentOrderId}&restaurant_id=${restaurantId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'ready') {
                        clearInterval(checkInterval);
                        renderReadyState();
                    } else if (data.status === 'archived' || data.status === 'not_found') {
                        clearInterval(checkInterval);
                        resetSession();
                    }
                })
                .catch(err => console.error("Ошибка проверки статуса:", err));
        }, 3000);
    }

    function renderReadyState() {
        const textBox = document.getElementById('status-box-text');
        textBox.className = 'ready-text';
        textBox.innerHTML = `🎉 ВАШ ЗАКАЗ ГОТОВ!<br><span style="font-size:16px; font-weight:normal; color:#fff;">Пожалуйста, заберите его на стойке выдачи.</span>`;
        document.getElementById('reset-btn').classList.remove('hidden');

        if ('vibrate' in navigator) {
            navigator.vibrate([500, 300, 500]);
        }
    }

    document.getElementById('reset-btn').addEventListener('click', function() {
        resetSession();
    });

    function resetSession() {
        if (checkInterval) clearInterval(checkInterval);
        localStorage.removeItem(`active_order_id_${restaurantId}`);
        localStorage.removeItem(`active_order_num_${restaurantId}`);
        currentOrderId = null;

        document.getElementById('order_number').value = '';
        document.getElementById('status-screen').classList.add('hidden');
        document.getElementById('form-screen').classList.remove('hidden');
    }
</script>
</body>
</html>
