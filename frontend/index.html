<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FoodNotifier SaaS</title>
    <style>
        body { font-family: sans-serif; margin: 50px; background: #f4f6f9; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; }
        #api-data { font-weight: bold; color: #2563eb; }
    </style>
</head>
<body>
<div class="card">
    <h1>Панель FoodNotifier Frontend</h1>
    <p>Статус ответа API: <span id="api-data">Загрузка данных...</span></p>
</div>

<script>
    // Фронтенд отправляет fetch-запрос к нашему Laravel API через Nginx
    fetch('/api/test')
        .then(response => response.json())
        .then(data => {
            document.getElementById('api-data').innerText = data.message;
        })
        .catch(err => {
            document.getElementById('api-data').innerText = 'Ошибка подключения к API';
            console.error(err);
        });
</script>
</body>
</html>
