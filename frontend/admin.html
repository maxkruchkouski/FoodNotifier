<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Панель управления — FoodNotifier SaaS</title>
    <style>
        :root {
            --bg-main: #121214;
            --bg-sidebar: #18181c;
            --bg-card: #1e1e24;
            --bg-input: #26262f;
            --primary: #ff9800;
            --primary-hover: #e68900;
            --text-main: #f5f5f7;
            --text-muted: #8a8a93;
            --border-color: #2a2a35;
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 70px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- САЙДБАР (SIDEBAR) --- */
        aside {
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            transition: var(--transition);
        }

        body.sidebar-collapsed aside {
            width: var(--sidebar-collapsed-width);
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            height: 70px;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: var(--transition);
            white-space: nowrap;
        }

        .logo-text span {
            color: var(--primary);
        }

        body.sidebar-collapsed .logo-text {
            opacity: 0;
            pointer-events: none;
            width: 0;
        }

        .burger-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: var(--transition);
        }

        .burger-btn:hover {
            background-color: var(--bg-input);
        }

        .sidebar-menu {
            list-style: none;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .menu-item button {
            width: 100%;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: left;
            transition: var(--transition);
        }

        .menu-item button:hover, .menu-item.active button {
            color: var(--text-main);
            background-color: var(--bg-input);
        }

        .menu-item.active button {
            color: var(--primary);
            font-weight: 600;
        }

        .menu-item button svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            fill: currentColor;
        }

        .menu-text {
            transition: var(--transition);
            white-space: nowrap;
        }

        body.sidebar-collapsed .menu-text {
            opacity: 0;
            pointer-events: none;
            width: 0;
        }

        .sidebar-user {
            padding: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: rgba(0, 0, 0, 0.15);
            height: 75px;
            overflow: hidden;
        }

        .avatar {
            width: 38px;
            height: 38px;
            background-color: var(--primary);
            color: var(--bg-main);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            transition: var(--transition);
            white-space: nowrap;
            flex-grow: 1;
        }

        body.sidebar-collapsed .sidebar-user {
            justify-content: center;
            padding: 15px 0;
        }

        body.sidebar-collapsed .user-info,
        body.sidebar-collapsed .logout-btn {
            display: none;
        }

        .user-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .user-email {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .logout-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            transition: var(--transition);
        }

        .logout-btn:hover {
            color: #ff4444;
            background-color: rgba(255, 68, 68, 0.1);
        }

        /* --- ОСНОВНОЙ КОНТЕНТ (MAIN CONTENT) --- */
        main {
            margin-left: var(--sidebar-width);
            padding: 30px;
            flex-grow: 1;
            transition: var(--transition);
            min-height: 100vh;
        }

        body.sidebar-collapsed main {
            margin-left: var(--sidebar-collapsed-width);
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input, select {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(255, 152, 0, 0.2);
        }

        /* ИСПРАВЛЕНО: Закрыли блок стилей и тег style */
        .btn-submit {
            background-color: var(--primary);
            color: #121214;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .kpi-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .kpi-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .action-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            margin-right: 12px;
        }
        .action-link:hover { text-decoration: underline; }
        ---
