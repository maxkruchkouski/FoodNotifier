<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кухня — FoodNotifier</title>
    <style>
        :root {
            --bg: #0f0f12;
            --card: rgba(30, 30, 36, 0.85);
            --accent: #ff9f1c;
            --success: #2ecc71;
            --text: #fff;
            --muted: #8a8a93;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at 50% 0%, #1a1a24 0%, #0f0f12 60%);
            color: var(--text);
            margin: 0;
            padding: 24px;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            backdrop-filter: blur(20px);
            padding: 16px 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        header h1 { font-size: 20px; margin: 0; font-weight: 700; }
        .badge-online {
            background: rgba(46, 204, 113, 0.12);
            color: var(--success);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: blink 2s infinite; }
        @keyframes blink { 50% { opacity: 0.4; } }
        .grid-title { font-size: 16px; color: var(--muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .order-card {
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .order-card:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3); }
        .order-card.cooking {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent), 0 12px 30px rgba(255, 159, 28, 0.15);
        }
        .order-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .order-num { font-size: 42px; font-weight: 800; color: var(--accent); margin: 0; line-height: 1; }
        .order-time { font-size: 13px; color: var(--muted); background: rgba(255, 255, 255, 0.05); padding: 6px 12px; border-radius: 8px; font-weight: 600; }
        .ready-btn {
            width: 100%;
            padding: 16px;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .ready-btn:hover { transform: translateY(-1px); }
        .ready-btn.start { background: var(--accent); color: #000; }
        .ready-btn.start:hover { box-shadow: 0 8px 20px rgba(255, 159, 28, 0.4); }
        .ready-btn.done { background: var(--success); }
        .ready-btn.done:hover { box-shadow: 0 8px 20px rgba(46, 204, 113, 0.4); }
        #no-orders {
            text-align: center;
            padding: 80px 40px;
            background: var(--card);
            border-radius: 20px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            color: var(--muted);
            font-style: italic;
            font-size: 16px;
        }
        .audio-prompt {
            position: fixed; inset: 0;
            background: rgba(10, 10, 12, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .prompt-box {
            background: #1e1e24;
            padding: 40px 50px;
            border-radius: 24px;
            text-align: center;
            border: 2px solid var(--accent);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        }
        .prompt-box h2 { color: var(--accent); margin: 0 0 12px 0; font-size: 26px; }
        .prompt-box p { color: var(--muted); margin: 0 0 20px; font-size: 15px; }
        .prompt-box button {
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 800;
            color: #000;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .error-title { color: #ff5252; padding: 20px; font-size: 16px; }
    </style>
</head>
<body>
<div id="audio-prompt" class="audio-prompt">
    <div class="prompt-box">
        <h2>👨‍🍳 Звуковые уведомления кухни</h2>
        <p>Активация голосового оповещения для поваров.</p>
        <button>Запустить экран кухни</button>
    </div>
</div>
<header>
    <h1 id="kitchen-title">Кухня</h1>
    <div class="badge-online"><span class="dot"></span> Онлайн</div>
</header>
<div class="grid-title">Заказы в работе</div>
<div class="orders-grid" id="orders-container"></div>
<div id="no-orders" style="display:none;">На кухне тишина... Активных заказов нет.</div>

<script>
    const API = '/api';
    const restaurantSlug = new URLSearchParams(location.search).get('restaurant');
    let previousPending = [];
    let voiceAllowed = false;
    let pollTimer = null;

    function apiFetch(path, options = {}) {
        if (!restaurantSlug) {
            return Promise.reject(new Error('Откройте страницу по QR-коду ресторана'));
        }
        const headers = {
            'Accept': 'application/json',
            'X-Restaurant-Id': restaurantSlug,
            ...(options.headers || {}),
        };
        if (options.body && !headers['Content-Type']) {
            headers['Content-Type'] = 'application/json';
        }
        return fetch(path, { ...options, headers }).then(async (res) => {
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                const err = new Error(data.message || data.error || `HTTP ${res.status}`);
                err.status = res.status;
                err.data = data;
                throw err;
            }
            return data;
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        if (!restaurantSlug) {
            document.getElementById('kitchen-title').innerHTML = '<span style="color:#ff5252;">⚠️ Ресторан не указан</span>';
            return;
        }
        document.getElementById('kitchen-title').innerText = `Кухня: ${restaurantSlug}`;
        loadOrders();
        pollTimer = setInterval(loadOrders, 3000);
    });

    document.getElementById('audio-prompt').addEventListener('click', function() {
        this.style.display = 'none';
        voiceAllowed = true;
        if ('speechSynthesis' in window) window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
    });

    function speakNewOrder(num) {
        if (!voiceAllowed || !('speechSynthesis' in window)) return;
        const u = new SpeechSynthesisUtterance(`Поступил новый заказ номер ${num}`);
        u.lang = 'ru-RU';
        u.rate = 0.9;
        window.speechSynthesis.speak(u);
    }

    async function loadOrders() {
        try {
            const orders = await apiFetch(`${API}/kitchen/orders`);
            renderOrders(orders);
        } catch (err) {
            if (err.status === 403) {
                document.getElementById('orders-container').innerHTML = '';
                document.getElementById('no-orders').style.display = 'block';
                document.getElementById('no-orders').innerHTML = '<span class="error-title">⚠️ Доступ заблокирован. Оплатите тариф.</span>';
                clearInterval(pollTimer);
            } else {
                console.error('Ошибка загрузки заказов:', err);
            }
        }
    }

    function renderOrders(orders) {
        const container = document.getElementById('orders-container');
        const noOrders = document.getElementById('no-orders');
        container.innerHTML = '';

        if (!orders || orders.length === 0) {
            noOrders.style.display = 'block';
            previousPending = [];
            return;
        }
        noOrders.style.display = 'none';

        orders.forEach(order => {
            const card = document.createElement('div');
            card.className = 'order-card' + (order.status === 'cooking' ? ' cooking' : '');

            const button = order.status === 'pending'
                ? `<button class="ready-btn start" onclick="startCooking(${order.id})">В работу</button>`
                : `<button class="ready-btn done" onclick="markReady(${order.id})">Готов</button>`;

            card.innerHTML = `
                <div class="order-header">
                    <div>
                        <span style="font-size: 12px; color: var(--muted); display:block; margin-bottom:6px; text-transform: uppercase; letter-spacing: 1px;">Номер чека</span>
                        <h2 class="order-num">${order.order_number}</h2>
                    </div>
                    <span class="order-time">${order.created_at}</span>
                </div>
                ${button}
            `;
            container.appendChild(card);
        });

        const currentPending = orders.filter(o => o.status === 'pending').map(o => o.order_number);
        currentPending.forEach(num => {
            if (!previousPending.includes(num)) speakNewOrder(num);
        });
        previousPending = currentPending;
    }

    async function startCooking(orderId) {
        try {
            await apiFetch(`${API}/kitchen/orders/start`, {
                method: 'POST',
                body: JSON.stringify({ order_id: orderId }),
            });
            loadOrders();
        } catch (err) {
            alert(err.message || 'Ошибка');
        }
    }

    async function markReady(orderId) {
        try {
            await apiFetch(`${API}/kitchen/orders/ready`, {
                method: 'POST',
                body: JSON.stringify({ order_id: orderId }),
            });
            loadOrders();
        } catch (err) {
            alert(err.message || 'Ошибка');
        }
    }
</script>
</body>
</html>
