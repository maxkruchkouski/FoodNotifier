<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodNotifier — Касса</title>
    <style>
        :root {
            --bg: #0f0f12;
            --bg-card: #1a1a20;
            --bg-input: #24242c;
            --border: #2e2e38;
            --text: #e5e5ea;
            --text-muted: #8e8e99;
            --accent: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 40px 20px;
            display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 600px; }
        .brand { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; }
        .brand span { color: var(--accent); }
        .subtitle { color: var(--text-muted); margin-bottom: 32px; }
        .card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; padding: 24px; margin-bottom: 24px;
        }
        label { display: block; color: var(--text-muted); font-size: 0.85rem;
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .input-row { display: flex; gap: 12px; }
        .input-row input { flex: 1; min-width: 0; }
        input {
            flex: 1; background: var(--bg-input); border: 1px solid var(--border);
            color: var(--text); padding: 14px 16px; border-radius: 10px;
            font-size: 1.4rem; font-weight: 700; text-align: center;
            letter-spacing: 2px;
        }
        input:focus { outline: none; border-color: var(--accent); }
        button {
            background: var(--accent); color: #111; border: none;
            padding: 14px 24px; border-radius: 10px; font-size: 1rem;
            font-weight: 700; cursor: pointer; transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-block { width: 100%; margin-top: 16px; padding: 16px; font-size: 1.1rem; }
        .recent-title { color: var(--text-muted); font-size: 0.85rem;
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
        .order-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: var(--bg-input);
            border-radius: 10px; margin-bottom: 8px;
        }
        .order-num { font-size: 1.2rem; font-weight: 700; }
        .order-status { font-size: 0.85rem; padding: 4px 10px; border-radius: 6px; }
        .status-pending { background: rgba(107,114,128,0.2); color: #9ca3af; }
        .status-cooking { background: rgba(245,158,11,0.2); color: var(--accent); }
        .status-ready { background: rgba(59,130,246,0.2); color: #3b82f6; }
        .status-completed { background: rgba(16,185,129,0.2); color: var(--success); }
        .empty { color: var(--text-muted); text-align: center; padding: 24px; }
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            padding: 14px 24px; border-radius: 10px; font-weight: 600;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .toast.show { opacity: 1; }
        .toast-ok { background: var(--success); color: #fff; }
        .toast-err { background: var(--danger); color: #fff; }
        .logout { position: absolute; top: 24px; right: 24px;
            color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }
        .logout:hover { color: var(--danger); }
    
        input:focus { outline: none; border-color: var(--accent); background: var(--bg-input); }
        input::selection { background: rgba(245,158,11,0.4); color: #fff; }
        input { caret-color: var(--accent); }
    
        @media (max-width: 480px) {
            .input-row { flex-direction: column; }
            .input-row button { width: 100%; }
        }
    
        input { color: #fff; }
        input::placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-size: 1rem;
            letter-spacing: 0;
        }
    </style>
</head>
<body>
    <a href="#" class="logout" id="logout-btn">Выйти</a>

    <div class="container">
        <div class="brand">Food<span>Notifier</span></div>
        <div class="subtitle">Касса — ввод номера заказа</div>

        <div class="card">
            <label>Номер заказа из кипера</label>
            <div class="input-row">
                <input type="text" id="order-number" placeholder="Введите номер" autofocus inputmode="numeric">
                <button id="create-btn">Создать</button>
            </div>
        </div>

        <div class="card">
            <div class="recent-title">Последние заказы</div>
            <div id="recent-orders"><div class="empty">Загрузка...</div></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = '/api';
        const TOKEN = localStorage.getItem('auth_token');

        if (!TOKEN) {
            window.location.href = '/login.html';
        }

        // Получаем slug ресторана из localStorage (его ставит админка) или дефолт
        let RESTAURANT_SLUG = localStorage.getItem('current_restaurant') || 'coffee-house';

        function showToast(msg, type = 'ok') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show ' + (type === 'ok' ? 'toast-ok' : 'toast-err');
            setTimeout(() => t.className = 'toast', 2500);
        }

        async function apiFetch(path, opts = {}) {
            const res = await fetch(API + path, {
                ...opts,
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                    'Authorization': 'Bearer ' + TOKEN,
                    'X-Restaurant-Id': RESTAURANT_SLUG,
                    ...(opts.headers || {}),
                },
            });
            if (res.status === 401) {
                localStorage.removeItem('auth_token');
                window.location.href = '/login.html';
                throw new Error('Unauthorized');
            }
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || ('HTTP ' + res.status));
            }
            return res.json();
        }

        async function loadRecent() {
            const box = document.getElementById('recent-orders');
            try {
                const orders = await apiFetch('/kitchen/orders');
                if (!orders || orders.length === 0) {
                    box.innerHTML = '<div class="empty">Пока пусто</div>';
                    return;
                }
                box.innerHTML = orders.slice(0, 10).map(o => {
                    const statusText = { pending: 'Ждёт', cooking: 'Готовится', ready: 'Готов', completed: 'Выдан' }[o.status] || o.status;
                    return '<div class="order-item">' +
                        '<div class="order-num">#' + o.order_number + '</div>' +
                        '<div class="order-status status-' + o.status + '">' + statusText + '</div>' +
                        '</div>';
                }).join('');
            } catch (e) {
                box.innerHTML = '<div class="empty">Ошибка загрузки: ' + e.message + '</div>';
            }
        }

        async function createOrder() {
            const input = document.getElementById('order-number');
            const btn = document.getElementById('create-btn');
            const num = input.value.trim();
            if (!num) { input.focus(); return; }

            btn.disabled = true;
            try {
                const res = await apiFetch('/orders', {
                    method: 'POST',
                    body: JSON.stringify({ order_number: num }),
                });
                showToast('Заказ #' + num + ' создан', 'ok');
                input.value = '';
                input.focus();
                await loadRecent();
            } catch (e) {
                showToast('Ошибка: ' + e.message, 'err');
            } finally {
                btn.disabled = false;
            }
        }

        document.getElementById('create-btn').addEventListener('click', createOrder);
        document.getElementById('order-number').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') createOrder();
        });
        document.getElementById('logout-btn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('auth_token');
            window.location.href = '/login.html';
        });

        loadRecent();
        setInterval(loadRecent, 5000);
    </script>
</body>
</html>
