<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — FoodNotifier</title>
    <style>
        :root { --bg: #0f0f12; --accent: #ff9f1c; --text: #fff; --muted: #8a8a93; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at 50% 0%, #1a1a24 0%, #0f0f12 60%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: rgba(30, 30, 36, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 44px 36px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 32px;
            background: linear-gradient(135deg, #fff 0%, #b0b0b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo span { -webkit-text-fill-color: var(--accent); color: var(--accent); }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .form-group label { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 159, 28, 0.15); }
        .btn-login {
            background: var(--accent);
            color: #000;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            font-size: 16px;
            margin-top: 12px;
            transition: transform 0.15s, box-shadow 0.15s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-login:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(255, 159, 28, 0.3); }
    </style>
</head>
<body>
<div class="login-card">
    <div class="logo">Food<span>Notifier</span></div>
    <form id="login-form">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login">Войти</button>
    </form>
</div>
<script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        try {
            const response = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                body: JSON.stringify(Object.fromEntries(formData.entries())),
            });
            const data = await response.json();
            if (response.ok && data.token) {
                localStorage.setItem('auth_token', data.token);
                const redirect = new URLSearchParams(location.search).get('redirect');
            if (redirect) {
                window.location.href = redirect;
                if (data.user?.position === 'cashier') {
                    window.location.href = '/cashier.html';
                } else if (data.user?.position === 'chef') {
                    window.location.href = '/kitchen.html';
                } else if (data.user?.role === 'owner' || data.user?.role === 'admin' || data.user?.is_superadmin) {
                    window.location.href = '/admin.html';
                } else {
                    window.location.href = '/admin.html';
                }
            } else {
                alert('Ошибка: ' + (data.message || 'Неверные данные'));
            }
        } catch (err) {
            console.error(err);
            alert('Нет связи с сервером');
        }
    });
</script>
</body>
</html>
