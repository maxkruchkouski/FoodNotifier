<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — FoodNotifier SaaS</title>
    <style>
        :root {
            --bg-main: #121214;
            --bg-card: #1e1e24;
            --bg-input: #26262f;
            --primary: #ff9800;
            --primary-hover: #e68900;
            --text-main: #f5f5f7;
            --text-muted: #8a8a93;
            --border-color: #2a2a35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 28px;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: var(--primary);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(255, 152, 0, 0.15);
        }

        .btn-login {
            background-color: var(--primary);
            color: #121214;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn-login:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="logo">Food<span>Notifier</span></div>
    <form id="login-form">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" value="admin@foodnotifier.by" required>
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" name="password" value="admin123" required>
        </div>
        <button type="submit" class="btn-login">Войти в панель</button>
    </form>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);

        try {
            // Отправляем запрос на ваш эндпоинт авторизации суперадмина / партнера
            const response = await fetch('http://localhost:8000/api/admin/login', {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(Object.fromEntries(formData.entries()))
            });

            const data = await response.json();

            if (response.ok && data.token) {
                // Сохраняем полученный Sanctum-токен бэкенда в память браузера
                localStorage.setItem('auth_token', data.token);
                // Перенаправляем обратно в ожившую админку
                window.location.href = '/admin.html';
            } else {
                alert('Ошибка: ' + (data.message || 'Неверные данные для входа'));
            }
        } catch (err) {
            console.error(err);
            alert('Нет связи с бэкенд-сервером Laravel');
        }
    });
</script>
</body>
</html>
